services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPACTPHONE_DEV_IMAGE:-compactphone-dev:latest}
    container_name: compactphone-dev
    working_dir: /workspace
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ../..:/workspace
      - ${VCPKG_ARCHIVES_DIR:-vcpkg-archives}:/root/.cache/vcpkg
    # ThreadSanitizer (make test-tsan) needs the personality() syscall to
    # disable ASLR at startup on aarch64; Docker's default seccomp profile
    # blocks it and libtsan CHECK-fails before main(). Local dev fixture
    # only — never run untrusted code in this container.
    security_opt:
      - seccomp=unconfined
    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - compactphone-net

  asterisk:
    image: andrius/asterisk:20
    container_name: compactphone-asterisk
    volumes:
      - ../../tests/integration/docker/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ../../tests/integration/docker/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ../../tests/integration/docker/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ../../tests/integration/docker/tls:/etc/asterisk/tls:ro
    restart: unless-stopped
    # Publish SIP + a chunk of RTP to the host so a macOS-host build can
    # register at 127.0.0.1:5060 and place real audio calls.
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "10000-10100:10000-10100/udp"
    networks:
      compactphone-net:
        aliases:
          - asterisk

networks:
  compactphone-net:
    driver: bridge
    # Pinned: the Asterisk fixture's local_net (tests/integration/docker/
    # pjsip.conf) must match this subnet exactly. Without ipam pinning,
    # Docker assigns whatever pool is free at network-creation time; when
    # that drifted off 192.168.144.0/24, Asterisk classified the dev
    # container as "external" and rewrote Contact/SDP to 127.0.0.1 — every
    # in-dialog request (re-INVITE/ACK/BYE) then targeted the wrong host and
    # hold/unhold never completed.
    ipam:
      config:
        - subnet: 192.168.144.0/24

volumes:
  vcpkg-archives:
