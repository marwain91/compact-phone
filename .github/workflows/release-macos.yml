name: Release · macOS

# Fires on every v* tag. Builds the .app, signs + notarizes + staples the
# DMG, and uploads to the matching GitHub Release. Tags containing "-test"
# may produce unsigned dev artifacts; production tags fail if signing and
# notarization secrets are missing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0-test7"
        required: true
        type: string
      source_ref:
        description: "Git ref to build. Empty = selected workflow ref."
        required: false
        default: ""
        type: string
      warm_caches_only:
        # GitHub Actions caches saved on a tag ref are invisible to runs on
        # other tags; only same-ref and default-branch caches are restorable.
        # Dispatch this workflow ON THE MAIN REF with this flag (tag input can
        # be a placeholder like "warm") after vcpkg.json/triplet changes, so
        # release tags stop paying the cold Qt build that killed v0.1.9.
        description: "Build deps + save caches only; no signing/publishing. Dispatch on main."
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # attach assets to the release
  # No packages:read (builds its own toolchain, never pulls GHCR) and no
  # id-token:write (signs locally via an imported keychain identity, not OIDC)
  # — unlike release-linux (GHCR) and release-windows (Azure OIDC).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

# Serialize runs for the same tag (a tag push + a manual dispatch can collide)
# so two jobs never upload the same release assets at once. cancel-in-progress
# is false: a signing/notarization/publish in flight must never be interrupted.
# Uses the raw github/inputs expression because env.* is unavailable here.
concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    name: Build, sign, notarize + publish DMG
    runs-on: macos-15
    # No `environment: release` (unlike release-windows, where it is required
    # for the Azure OIDC subject to match). The Apple P12 / notary creds are
    # read from repo-level secrets; gate them behind an environment in repo
    # settings first if that protection is wanted, or the job loses the secrets.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}

      # Warm-caches runs skip both validations: they dispatch off main with a
      # placeholder tag, and never touch signing.
      - name: Validate release tag
        if: inputs.warm_caches_only != true
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "error: release tag must start with v; got '$RELEASE_TAG'" >&2
            exit 1
          fi
          python3 tools/release/verify-release-version.py "$RELEASE_TAG"

      - name: Validate production signing config
        if: inputs.warm_caches_only != true
        env:
          REF_NAME: ${{ env.RELEASE_TAG }}
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [[ "$REF_NAME" == *"-test"* ]]; then
            echo "Test tag detected; unsigned macOS artifact is allowed."
            exit 0
          fi

          missing=0
          for name in \
            P12_BASE64 \
            P12_PASSWORD \
            DEVELOPER_ID_APP \
            NOTARY_APPLE_ID \
            NOTARY_TEAM_ID \
            NOTARY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "error: $name is required for production macOS releases" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install build deps
        # autoconf-archive ships the m4 macros vcpkg's libb2 portfile needs
        # for autoreconf; without it cold builds fail with libb2 BUILD_FAILED.
        # Mirrors the fix already in ci.yml and tools/dev/Dockerfile.
        run: brew install cmake ninja pkg-config create-dmg autoconf autoconf-archive automake libtool

      # Split restore/save (matching release-linux / release-windows) so a
      # late failure — Apple notarization can fail after a 1h+ cold Qt build —
      # never discards the freshly-built deps. The combined actions/cache@v5
      # only saves on job success; the saves below run on success right after
      # the build, plus a partial save on failure (see end of job).
      - name: Restore vcpkg
        id: vcpkg-tool-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg-configuration.json', 'vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Restore macOS vcpkg deps
        id: vcpkg-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/build/macos/vcpkg_installed
          key: vcpkg-macos-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg-configuration.json', 'vcpkg.json', 'tools/release/triplets/arm64-osx.cmake') }}
          restore-keys: |
            vcpkg-macos-deps-partial-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg-configuration.json', 'vcpkg.json', 'tools/release/triplets/arm64-osx.cmake') }}-
            vcpkg-macos-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup vcpkg
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          if [ ! -d vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=$WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      # PJSIP is a deterministic, out-of-band build (pinned 2.17 + fixed
      # configure flags), so cache the install prefix and skip the compile on a
      # hit — mirroring release-windows. Bump the key suffix when the version or
      # configure flags change.
      - name: Restore PJSIP build
        id: pjsip-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/pjproject
          key: pjsip-macos-2.17-v1

      - name: Build PJSIP
        if: steps.pjsip-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/pjsip/pjproject/archive/refs/tags/2.17.tar.gz | tar -xz
          cd pjproject-2.17
          ./aconfigure --prefix="$HOME/pjproject" \
            --disable-shared --enable-static --with-ssl=yes \
            --disable-video --disable-libwebrtc --disable-libyuv \
            --disable-opencore-amr --disable-bcg729 --disable-sdl \
            --disable-ffmpeg --disable-v4l2 --disable-openh264
          make dep && make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Save PJSIP build
        if: success() && steps.pjsip-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/pjproject
          key: ${{ steps.pjsip-cache.outputs.cache-primary-key }}

      # Export the pkg-config path whether PJSIP was rebuilt or restored.
      - name: Export PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=$HOME/pjproject/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          sentry_args=()
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            sentry_args+=("-DVCPKG_MANIFEST_FEATURES=sentry")
            sentry_args+=("-DCOMPACTPHONE_ENABLE_SENTRY=ON")
            sentry_args+=("-DCOMPACTPHONE_SENTRY_DSN=${SENTRY_DSN}")
          fi
          cmake --preset macos \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/tools/release/triplets" \
            "${sentry_args[@]}"

      # Warm-caches runs stop after Configure: the vcpkg caches saved below are
      # fully populated by the manifest install during Configure, so compiling
      # the app itself adds nothing to them.
      - name: Build
        if: inputs.warm_caches_only != true
        run: cmake --build --preset macos

      # Save the expensive vcpkg caches now, right after a successful build and
      # BEFORE signing/notarization — so a late notarization failure does not
      # discard the cold Qt build. (A build-time failure is caught by the
      # partial save at the end of the job.)
      - name: Save vcpkg
        if: success() && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/vcpkg
          key: ${{ steps.vcpkg-tool-cache.outputs.cache-primary-key }}

      - name: Save macOS vcpkg deps
        if: success() && steps.vcpkg-deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/build/macos/vcpkg_installed
          key: ${{ steps.vcpkg-deps-cache.outputs.cache-primary-key }}

      - name: Import signing identity
        if: inputs.warm_caches_only != true
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "APPLE_DEVELOPER_ID_P12_BASE64 not set — skipping import"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize DMG
        if: inputs.warm_caches_only != true
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          # Stable filename (no version) so the landing-page Download
          # button can hardcode .../releases/latest/download/Compact-Phone-macOS.dmg
          # and never need updating per release. The version is still
          # carried in the appcast's sparkle:shortVersionString and
          # inside the .app's Info.plist.
          if [ -z "$DEVELOPER_ID_APP" ]; then
            if [[ "$REF_NAME" != *"-test"* ]]; then
              echo "error: signing identity missing for production macOS release" >&2
              exit 1
            fi
            echo "Signing identity missing — producing unsigned DMG"
            mkdir -p dist
            STAGE=$(mktemp -d)
            cp -R "build/macos/src/Compact Phone.app" "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "Compact Phone" -srcfolder "$STAGE" \
              -ov -format UDZO "dist/Compact-Phone-macOS.dmg"
          else
            ./packaging/macos/build-dmg.sh
          fi

      # Generate the appcast that UpdateChecker fetches at
      # https://github.com/marwain91/compact-phone/releases/latest/download/appcast-macos.xml
      # Sparkle 2.x format. Signed with EdDSA when the secret is set
      # (it's not strictly required by our in-tree UpdateChecker yet,
      # but it's the right hygiene for when we adopt the real Sparkle
      # framework).
      - name: Generate macOS appcast
        if: inputs.warm_caches_only != true
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          # cryptography is only needed to EdDSA-sign the appcast; the
          # generator is pure-stdlib when unsigned. Install it only when a key
          # is set, matching release-linux / release-windows.
          if [[ -n "${SPARKLE_ED25519_PRIVATE_KEY:-}" ]]; then
            python3 -m pip install --quiet --user cryptography
          fi
          VERSION="${REF_NAME#v}"
          DMG=$(find dist -maxdepth 1 -type f -name '*.dmg' | head -n 1)
          if [[ -z "$DMG" ]]; then
            echo "error: DMG not found under dist" >&2
            exit 1
          fi
          DMG_NAME=$(basename "$DMG")
          python3 tools/release/generate-appcast.py \
            --version "$VERSION" \
            --asset-url "https://github.com/marwain91/compact-phone/releases/download/${REF_NAME}/${DMG_NAME}" \
            --asset-file "$DMG" \
            --os macos \
            --output dist/appcast-macos.xml

      - name: Upload DMG + appcast to release
        if: inputs.warm_caches_only != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-test') }}
          files: |
            dist/*.dmg
            dist/appcast-macos.xml
          fail_on_unmatched_files: true

      # If the job failed (e.g. the build itself died partway through vcpkg),
      # save whatever deps were built under a run-scoped partial key so the
      # next attempt resumes instead of recompiling Qt from scratch. Mirrors
      # release-linux's partial save.
      - name: Save partial macOS vcpkg deps
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/build/macos/vcpkg_installed
          key: vcpkg-macos-deps-partial-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg-configuration.json', 'vcpkg.json', 'tools/release/triplets/arm64-osx.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
