name: Trigger MyWebs docs build

on:
  push:
    branches: [main]
    paths: ['web/docs/**']
  workflow_dispatch: {}

permissions: {}

jobs:
  trigger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the CompactPhone main build
        env:
          DEPLOY_HOOK: ${{ secrets.MYWEBS_DOCS_DEPLOY_HOOK }}
        run: |
          if [[ ! "$DEPLOY_HOOK" =~ ^https://api\.cloudflare\.com/client/v4/workers/builds/deploy_hooks/[A-Za-z0-9_-]+$ ]]; then
            echo '::error::MYWEBS_DOCS_DEPLOY_HOOK is missing or invalid'
            exit 1
          fi
          response="$RUNNER_TEMP/deploy-hook-response.json"
          printf 'url = "%s"\n' "$DEPLOY_HOOK" |
            curl -4 --config - --request POST --fail --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              --output "$response"
          jq -e '.success == true
            and (.result.build_uuid | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
            and (.result.branch == null or .result.branch == "main")' "$response" > /dev/null
          jq -r '"Workers build accepted: " + .result.build_uuid' "$response"
